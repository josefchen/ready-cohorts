r, Aptos, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" opacity="1">OBSERVED</text><text x="558" y="873" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start" opacity="1">named GPU placements</text><rect x="820" y="850" width="126" height="34" rx="17" fill="#F2F4F7" stroke="#C9D1DC"/><text x="883" y="873" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" opacity="1">PROPOSED</text><text x="960" y="873" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start" opacity="1">finite online system</text><text x="72" y="948" fill="#2457A7" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="760" text-anchor="start" opacity="1">arXiv:2608.12123</text><text x="1528" y="948" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="650" text-anchor="end" opacity="1">Josef Chen · Independent Researcher</text>
