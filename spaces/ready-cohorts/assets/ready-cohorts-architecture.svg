#F2F4F7" stroke="#C9D1DC" stroke-width="1"/><text x="417" y="655" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" opacity="1">resident</text><text x="417" y="674" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" opacity="1">state</text><line x1="470" y1="659" x2="474" y2="659" stroke="#5B6675" stroke-width="2" marker-end="url(#arrow)"/><rect x="482" y="632" width="102" height="54" rx="10" fill="#F7EEDC" stroke="#A86C12" stroke-width="1"/><text x="533" y="655" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" opacity="1">predicate</text><text x="533" y="674" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" opacity="1">GPU</text><line x1="586" y1="659" x2="590" y2="659" stroke="#5B6675" stroke-width="2" marker-end="url(#arrow)"/><rect x="598" y="632" width="102" height="54" rx="10" fill="#F7EEDC" stroke="#A86C12" stroke-width="1"/><text x="649" y="655" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" opacity="1">selector</text><text x="649" y="674" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" opacity="1">GPU</text><line x1="702" y1="659" x2="706" y2="659" stroke="#5B6675" stroke-width="2" marker-end="url(#arrow)"/><rect x="714" y="632" width="102" height="54" rx="10" fill="#F2F4F7" stroke="#C9D1DC" stroke-width="1"/><text x="765" y="655" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="700" text-anchor="middle" opacity="1">route graph</text><text x="765" y="674" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="11" font-weight="500" text-anchor="middle" opacity="1">GPU</text><text x="366" y="720" fill="#A86C12" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="760" text-anchor="start" opacity="1">Host / resident  1.19–2.39×</text><text x="366" y="748" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="start" opacity="1">36/36 cells favor resident · fixed nested launch slower in 60/60</text><line x1="854" y1="366" x2="914" y2="366" stroke="#5B6675" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><line x1="854" y1="642" x2="914" y2="642" stroke="#5B6675" stroke-width="2" stroke-dasharray="8 7" marker-end="url(#arrow)"/><rect x="926" y="246" width="602" height="518" rx="18" fill="#FFFFFF" stroke="#5B6675" stroke-width="2" stroke-dasharray="9 8"/><rect x="952" y="270" width="250" height="34" rx="17" fill="#F2F4F7" stroke="#C9D1DC"/><text x="1077" y="293" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" opacity="1">03  JOINED RUNTIME · PROPOSED</text><text x="952" y="330" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="29" font-weight="700" text-anchor="start" opacity="1">Deadline-aware GPU route service</text><text x="952" y="360" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="500" text-anchor="start" opacity="1">The architecture implied by both gates, not a measured deployment.</text><rect x="952" y="397" width="132" height="66" rx="10" fill="#F2F4F7" stroke="#C9D1DC" stroke-width="1"/><text x="1018" y="423" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" opacity="1">typed ingress</text><text x="1018" y="444" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle" opacity="1">ordered events</text><line x1="1086" y1="430" x2="1121" y2="430" stroke="#5B6675" stroke-width="2" marker-end="url(#arrow)"/><rect x="1131" y="397" width="142" height="66" rx="10" fill="#E8EEF9" stroke="#2457A7" stroke-width="1"/><text x="1202" y="423" fill="#173C78" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" opacity="1">deadline queues</text><text x="1202" y="444" fill="#173C78" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle" opacity="1">GPU state</text><line x1="1275" y1="430" x2="1310" y2="430" stroke="#5B6675" stroke-width="2" marker-end="url(#arrow)"/><rect x="1320" y="397" width="178" height="66" rx="10" fill="#F7EEDC" stroke="#A86C12" stroke-width="1"/><text x="1409" y="423" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" opacity="1">effect descriptors</text><text x="1409" y="444" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="12" font-weight="500" text-anchor="middle" opacity="1">ordered mailbox</text><line x1="1409" y1="465" x2="1409" y2="502" stroke="#5B6675" stroke-width="2" marker-end="url(#arrow)"/><rect x="1198" y="514" width="300" height="72" rx="10" fill="#F2F4F7" stroke="#17202D" stroke-width="1"/><text x="1348" y="542" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="middle" opacity="1">CPU / DPU authority plane</text><text x="1348" y="566" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle" opacity="1">validate · commit · recover · audit</text><line x1="1348" y1="587" x2="1042" y2="623" stroke="#5B6675" stroke-width="1"/><rect x="994" y="624" width="96" h