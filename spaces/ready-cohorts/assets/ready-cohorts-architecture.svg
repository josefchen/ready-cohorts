ca Neue, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start" opacity="1">deadline tᵢ + δ</text><line x1="283" y1="480" x2="329" y2="480" stroke="#5B6675" stroke-width="2" marker-end="url(#arrow)"/><rect x="340" y="246" width="512" height="242" rx="18" fill="#FFFFFF" stroke="#2457A7" stroke-width="2"/><rect x="366" y="270" width="222" height="34" rx="17" fill="#E8EEF9" stroke="none"/><text x="477" y="293" fill="#173C78" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" opacity="1">01  WORKLOAD GATE · COMPUTED</text><text x="366" y="330" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="27" font-weight="700" text-anchor="start" opacity="1">Ready before the deadline?</text><rect x="366" y="356" width="132" height="52" rx="10" fill="#F2F4F7" stroke="#C9D1DC" stroke-width="1"/><text x="432" y="378" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" opacity="1">route-key</text><text x="432" y="396" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle" opacity="1">queues</text><line x1="500" y1="382" x2="536" y2="382" stroke="#5B6675" stroke-width="2" marker-end="url(#arrow)"/><rect x="546" y="356" width="132" height="52" rx="10" fill="#E8EEF9" stroke="#2457A7" stroke-width="1"/><text x="612" y="378" fill="#173C78" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="700" text-anchor="middle" opacity="1">exact packer</text><text x="612" y="396" fill="#173C78" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle" opacity="1">P*</text><line x1="680" y1="382" x2="716" y2="382" stroke="#5B6675" stroke-width="2" marker-end="url(#arrow)"/><rect x="726" y="356" width="100" height="52" rx="10" fill="#F2F4F7"