<rect width="1600" height="1000" fill="#F2F4F7"/><circle cx="1452.0" cy="64.0" r="7.2" fill="#2457A7"/><circle cx="1485.6" cy="43.6" r="7.2" fill="#2457A7"/><circle cx="1485.6" cy="84.4" r="7.2" fill="#2457A7"/><circle cx="1519.2" cy="64.0" r="7.2" fill="#A86C12"/><path d="M 1460.4 64.0 H 1509.6" stroke="#C9D1DC" stroke-width="2.4" fill="none"/><text x="72" y="68" fill="#2457A7" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="start" letter-spacing="2.2" opacity="1">READY COHORTS / SYSTEM MAP</text><text x="72" y="130" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="46" font-weight="720" text-anchor="start" opacity="1">A GPU control plane has two gates.</text><text x="72" y="176" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="21" font-weight="500" text-anchor="start" opacity="1">This paper measures them separately. The finite online runtime remains the next experiment.</text><line x1="72" y1="208" x2="1528" y2="208" stroke="#17202D" stroke-width="2"/><text x="72" y="270" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="760" text-anchor="start" letter-spacing="1.8" opacity="1">AGENT EVENTS</text><text x="72" y="303" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="start" opacity="1">Completions become</text><text x="72" y="329" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="20" font-weight="650" text-anchor="start" opacity="1">control transitions.</text><rect x="72" y="370" width="210" height="50" rx="10" fill="#FFFFFF" stroke="#C9D1DC" stroke-width="1"/><circle cx="94" cy="395" r="7" fill="#2457A7"/><text x="112" y="391" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="700" text-anchor="start" opacity="1">