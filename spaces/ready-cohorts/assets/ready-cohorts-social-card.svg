<rect width="1600" height="900" fill="#F2F4F7"/><rect width="1600" height="12" fill="#2457A7"/><circle cx="1455.0" cy="70.0" r="8.1" fill="#2457A7"/><circle cx="1492.8" cy="47.0" r="8.1" fill="#2457A7"/><circle cx="1492.8" cy="93.0" r="8.1" fill="#2457A7"/><circle cx="1530.6" cy="70.0" r="8.1" fill="#A86C12"/><path d="M 1464.5 70.0 H 1519.8" stroke="#C9D1DC" stroke-width="2.7" fill="none"/><text x="74" y="76" fill="#2457A7" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="760" text-anchor="start" letter-spacing="1.8" opacity="1">NEW PAPER · arXiv:2608.12123</text><text x="74" y="166" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="61" font-weight="730" text-anchor="start"><tspan x="74" dy="0">When should agent</tspan><tspan x="74" dy="68">control move to GPU?</tspan></text><text x="74" y="328" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="24" font-weight="500" text-anchor="start"><tspan x="74" dy="0">Ready Cohorts maps the boundary between</tspan><tspan x="74" dy="34">workload supply and device-resident control.</tspan></text><rect x="925" y="128" width="588" height="340" rx="22" fill="#FFFFFF" stroke="#C9D1DC" stroke-width="2"/><text x="959" y="173" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="760" text-anchor="start" letter-spacing="1.7" opacity="1">THE ARCHITECTURE</text><rect x="959" y="210" width="156" height="82" rx="14" fill="#E8EEF9" stroke="#2457A7" stroke-width="2"/><text x="1037" y="242" fill="#173C78" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="middle" opacity="1">ready events</text><text x="1037" y="267" fill="#173C78" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle" opacity="1">route + deadline</text><line x1="1118" y1="251" x2="1162" y2="251" stroke="#5B6675" stroke-width="2" marker-end="url(#arrow)"/><rect x="1172" y="210" width="156" height="82" rx="14" fill="#F7EEDC" stroke="#A86C12" stroke-width="2"/><text x="1250" y="242" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="15" font-weight="760" text-anchor="middle" opacity="1">GPU decision</text><text x="1250" y="267" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle" opacity="1">resident state</text><line x1="1331" y1="251" x2="1375" y2="251" stroke="#5B6675" stroke-width="2" marker-end="url(#arrow)"/><rect x="1385" y="210" width="94" height="82" rx="14" fill="#F2F4F7" stroke="#17202D" stroke-width="2"/><text x="1432" y="242" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="760" text-anchor="middle" opacity="1">effect</text><text x="1432" y="267" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle" opacity="1">mailbox</text><line x1="1432" y1="295" x2="1432" y2="330" stroke="#5B6675" stroke-width="2" marker-end="url(#arrow)"/><rect x="1172" y="340" width="307" height="74" rx="14" fill="#F2F4F7" stroke="#17202D" stroke-width="2"/><text x="1325" y="370" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="16" font-weight="760" text-anchor="middle" opacity="1">CPU / DPU authority</text><text x="1325" y="394" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="500" text-anchor="middle" opacity="1">external effects stay privileged</text><text x="959" y="447" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="650" text-anchor="start" opacity="1">Trace gate and mechanism gate measured separately</text><line x1="74" y1="500" x2="1526" y2="500" stroke="#17202D" stroke-width="2"/><text x="74" y="451" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="760" text-anchor="start" letter-spacing="1.0" opacity="1">FIXED WINDOWS → EXACT PACKING</text><text x="74" y="488" fill="#2457A7" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="760" text-anchor="start" opacity="1">30.19% → 43.00%</text><text x="510" y="451" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="760" text-anchor="start" letter-spacing="1.0" opacity="1">HOST / RESIDENT WALL TIME</text><text x="510" y="488" fill="#A86C12" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="36" font-weight="760" text-anchor="start" opacity="1">1.19–2.39×</text><text x="74" y="593" fill="#2457A7" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="760" text-anchor="start" opacity="1">+12.81 pp</text><text x="74" y="628" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" opacity="1">exact packing vs F</text><text x="74" y="654" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start" opacity="1">conditional trace computation</text><text x="466" y="593" fill="#A86C12" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="760" text-anchor="start" opacity="1">36/36</text><text x="466" y="628" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" opacity="1">cells favor resident</text><text x="466" y="654" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start" opacity="1">4 named placements</text><text x="858" y="593" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="44" font-weight="760" text-anchor="start" opacity="1">60/60</text><text x="858" y="628" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" opacity="1">nested launch slower</text><text x="858" y="654" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="14" font-weight="500" text-anchor="start" opacity="1">5 named placements</text><rect x="74" y="705" width="1452" height="74" rx="12" fill="#FFFFFF" stroke="#C9D1DC" stroke-width="2"/><text x="102" y="736" fill="#5B6675" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="13" font-weight="760" text-anchor="start" letter-spacing="1.4" opacity="1">EVIDENCE BOUNDARY</text><text x="102" y="763" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="start" opacity="1">Not an end-to-end speedup claim. The finite online runtime, CPU use, raw P99, and inference interference remain open.</text><line x1="74" y1="822" x2="1526" y2="822" stroke="#C9D1DC" stroke-width="2"/><text x="74" y="861" fill="#17202D" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" opacity="1">Josef Chen · Independent Researcher</text><text x="1526" y="861" fill="#2457A7" font-family="Inter, Aptos, Helvetica Neue, Arial, sans-serif" font-size="17" font-weight="650" text-anchor="end" opacity="1">github.com/josefchen/ready-cohorts</text>
</svg>
